# Builds the Windows installer and the portable zip, smoke-tests them on a real Windows machine,
# and attaches both to a GitHub Release when a version tag (v1.2.3) is pushed.
name: Windows app

on:
  push:
    branches: [master]
    tags: ['v*']
    paths:
      - 'desktop/**'
      - 'apps/**'
      - 'packages/**'
      - 'package-lock.json'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The SQLite module ships a prebuilt Windows (N-API) binary; without --ignore-scripts npm would
      # still run node-gyp, which fails looking for a Visual Studio it doesn't need.
      - name: Install (Windows builds of the native modules)
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          node -e "const D=require('better-sqlite3-multiple-ciphers'); const d=new D(':memory:'); console.log('SQLite', d.prepare('select sqlite_version() v').get().v); d.close()"

      - name: Build the server and the web app
        run: npm run build

      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: desktop
        run: npm pkg set version="${GITHUB_REF_NAME#v}"

      - name: Install the desktop shell's tools
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Stage Node, the server and the web app
        working-directory: desktop
        run: npm run stage

      - name: Build the installer
        working-directory: desktop
        env:
          # Unsigned by default (Windows SmartScreen will warn; see README › Windows).
          # To sign: add repository secrets WIN_CSC_LINK (base64 .pfx or https link) and
          # WIN_CSC_KEY_PASSWORD, then uncomment the two lines below and remove the next one.
          # CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          # CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Make the portable zip
        shell: pwsh
        working-directory: desktop
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $dir = "release/Everloom-Portable"
          Copy-Item -Recurse release/win-unpacked $dir
          Set-Content -Path "$dir/portable.txt" -Value "Everloom keeps its data in the data folder next to Everloom.exe."
          Compress-Archive -Path "$dir/*" -DestinationPath "release/Everloom-Portable-$version.zip"
          Remove-Item -Recurse $dir

      - name: Smoke test (install, start, chat, restart, uninstall, portable)
        run: node desktop/smoke.mjs

      - name: Logs on failure
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem -Recurse "$env:APPDATA\Everloom\logs" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "--- $($_.FullName)"; Get-Content $_.FullName -Tail 120 }

      - uses: actions/upload-artifact@v4
        with:
          name: everloom-windows
          path: |
            desktop/release/Everloom-Setup-*.exe
            desktop/release/Everloom-Portable-*.zip
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/Everloom-Setup-*.exe
            desktop/release/Everloom-Portable-*.zip
